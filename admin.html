<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#100B14">
<title>প্রোডাক্ট যোগ করুন | অ্যাডমিন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><main class="wrap">
<p style="margin:18px 0 0"><a href="index.html">← প্রোডাক্ট যোগ করুন (হোম)</a></p>
<h1 style="margin-top:28px;font-size:1.8rem">নতুন প্রোডাক্ট যোগ করুন</h1>
<form class="box" id="f">
<label>অ্যাডমিন পাসওয়ার্ড<input name="password" type="password" required></label>
<label>প্রোডাক্টের নাম<input name="name" required></label>
<div class="row" style="align-items:flex-start"><label style="flex:1;min-width:140px">দাম (৳)<input name="price" type="number" min="0" required></label>
<label style="flex:1;min-width:140px">আগের দাম (৳, ঐচ্ছিক — ছাড় দেখাতে)<input name="oldprice" type="number" min="0"></label></div>
<label>ক্যাটাগরি (যেমন Bridal, Necklace, Earrings)<input name="category" list="cats"><datalist id="cats"><option value="Bridal"><option value="Necklace"><option value="Earrings"><option value="New"></datalist></label>
<label>বিবরণ (প্রতি লাইনে একটা পয়েন্ট লিখলে বুলেট হয়ে দেখাবে)<textarea name="desc" rows="5"></textarea></label>
<label>YouTube ভিডিও লিংক (ঐচ্ছিক)<input name="video" type="url" placeholder="https://www.youtube.com/watch?v=..."></label>
<label>ছবির লিংক (প্রতি লাইনে একটা করে। Drive-এ "Anyone with the link" করে দিন)<textarea name="image" rows="4"></textarea></label>
<div class="row"><button class="btn" type="submit">প্রোডাক্ট সেভ করুন</button><span class="msg" id="msg" role="status"></span></div>
</form>
<h2 class="sec">রিভিউ যোগ করুন</h2>
<form class="box" id="rf">
<label>অ্যাডমিন পাসওয়ার্ড<input name="password" type="password" required></label>
<label>প্রোডাক্ট<select name="productId" id="rp" required></select></label>
<div class="row" style="align-items:flex-start"><label style="flex:2;min-width:160px">ক্রেতার নাম<input name="name" required maxlength="60"></label>
<label style="flex:1;min-width:100px">রেটিং<select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label></div>
<label>রিভিউ (ঐচ্ছিক)<textarea name="text" rows="3" maxlength="500"></textarea></label>
<div class="row"><button class="btn" type="submit">রিভিউ সেভ করুন</button><span class="msg" id="rmsg" role="status"></span></div>
</form>
<h2 class="sec">ক্রেতার রিভিউ অনুমোদন</h2>
<form class="box" id="pf"><label>অ্যাডমিন পাসওয়ার্ড<input name="password" type="password" required></label>
<button class="btn" type="submit">অপেক্ষমাণ রিভিউ দেখুন</button><div id="pl"></div></form>
<h2 class="sec">সব প্রোডাক্ট</h2><section class="grid" id="list"></section></main>
<script src="js/app.js"></script>
<script>
function fillSel(){document.getElementById("rp").innerHTML=(_c||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}
const list=document.getElementById("list"),msg=document.getElementById("msg"),f=document.getElementById("f");
renderList(list,true).then(fillSel);
function say(t,bad){msg.style.color=bad?"#ff7b6b":"";msg.textContent=t}
f.addEventListener("submit",async e=>{
  e.preventDefault();
  const {password,...p}=Object.fromEntries(new FormData(f));
  if(p.video&&!ytId(p.video))return say("YouTube লিংকটি সঠিক নয়, আবার দেখুন।",1);
  say("সেভ হচ্ছে...");
  try{
    const r=await api({action:"add",password,product:{id:Date.now(),...p}});
    if(!r.ok)return say(r.error||"সেভ হয়নি",1);
    sessionStorage.setItem("pw",password);f.reset();say("সেভ হয়েছে।");renderList(list,true).then(fillSel);
  }catch(err){say("সার্ভারে যোগাযোগ করা যায়নি।",1)}
});
list.addEventListener("click",async e=>{
  const id=e.target.dataset.del;if(!id||!confirm("এই প্রোডাক্ট মুছে ফেলবেন?"))return;
  const password=f.password.value||sessionStorage.getItem("pw")||prompt("অ্যাডমিন পাসওয়ার্ড দিন");if(!password)return;
  const r=await api({action:"delete",password,id});
  if(!r.ok)return say(r.error||"মোছা যায়নি",1);
  renderList(list,true).then(fillSel);
});
document.getElementById("rf").addEventListener("submit",async e=>{
  e.preventDefault();const rf=e.target,{password,...review}=Object.fromEntries(new FormData(rf)),rm=document.getElementById("rmsg");
  rm.style.color="";rm.textContent="সেভ হচ্ছে...";
  try{const r=await api({action:"addReview",password,review});
    if(!r.ok){rm.style.color="#ff7b6b";rm.textContent=r.error||"সেভ হয়নি";return}
    rf.reset();rm.textContent="রিভিউ যোগ হয়েছে।";
  }catch(err){rm.style.color="#ff7b6b";rm.textContent="সার্ভারে যোগাযোগ করা যায়নি।"}
});
const pl=document.getElementById("pl");let ppw="";
async function loadPending(){
  const r=await api({action:"pendingReviews",password:ppw});
  if(!r.ok){pl.textContent=r.error||"লোড হয়নি";return}
  pl.innerHTML=r.list.length?r.list.map(x=>`<div class="box" style="margin:8px 0"><b>${esc(x.product)}</b><div>${stars(x.rating)} ${esc(x.name)} <small>(অর্ডার ${esc(x.orderId)})</small></div><p style="margin:0">${esc(x.text)}</p>${x.photo?`<img class="rph" src="${esc(imgURL(x.photo,400))}" alt="">`:""}<div class="row"><button class="btn" data-d="approved" data-row="${x.row}" data-o="${esc(x.orderId)}">অনুমোদন</button><button class="btn alt" data-d="rejected" data-row="${x.row}" data-o="${esc(x.orderId)}">বাতিল</button></div></div>`).join(""):"কোনো অপেক্ষমাণ রিভিউ নেই।";
}
document.getElementById("pf").addEventListener("submit",e=>{e.preventDefault();ppw=e.target.password.value;loadPending()});
pl.addEventListener("click",async e=>{const b=e.target.closest("button[data-d]");if(!b)return;
  const r=await api({action:"moderate",password:ppw,row:b.dataset.row,orderId:b.dataset.o,decision:b.dataset.d});
  if(!r.ok){alert(r.error||"হয়নি");return}loadPending()});
</script></body></html>
