<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#352344">
<title>প্রোডাক্ট যোগ করুন — ARIFAH Admin</title>
<link rel="icon" type="image/svg+xml" href="assets/img/placeholder.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
<style>
  .pick { display: grid; place-items: center; gap: .35rem; border: 2px dashed #D8CCDA; border-radius: 14px; padding: 1.25rem .75rem; text-align: center; cursor: pointer; color: var(--plum); font-weight: 600; transition: all var(--dur-fast); background: #FDFBFD; }
  .pick:hover { border-color: var(--plum); background: var(--ivory); }
  .pick:focus-visible { outline: 2px solid var(--gold-deep); }
  .pv { display: flex; gap: .5rem; flex-wrap: wrap; }
  .pv .th { position: relative; width: 76px; height: 88px; border-radius: 10px; overflow: hidden; border: 1px solid #EDE8ED; }
  .pv .th img { width: 100%; height: 100%; object-fit: cover; }
  .pv .th button { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border-radius: 50%; background: rgba(20,10,28,.72); color: #fff; display: grid; place-items: center; font-size: .8rem; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
  fieldset.dv { border: 1.5px solid #E8E2E8; border-radius: 12px; padding: .55rem .75rem; }
  fieldset.dv legend { font-size: .8rem; font-weight: 700; padding: 0 .3rem; }
  .chk { display: flex; align-items: center; gap: .5rem; font-weight: 400; font-size: .88rem; padding: .2rem 0; }
  .chk input { width: 19px; height: 19px; accent-color: var(--purple); }
  .done { text-align: center; padding: 2rem 1.5rem; }
  .done a.link { display: block; word-break: break-all; color: var(--plum); font-weight: 700; background: var(--ivory); border: 1px dashed var(--gold); border-radius: 10px; padding: .6rem .75rem; margin: .75rem 0; }
</style>
</head>
<body>
<button class="side-toggle" id="sideToggle" aria-label="মেনু"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

<div class="shell">
  <aside class="sidebar" id="admin-sidebar" aria-label="সাইডবার"></aside>

  <main class="content" style="max-width:760px">
    <div class="page-head">
      <div><h1>নতুন প্রোডাক্ট যোগ করুন</h1><p class="sub">ছবি ড্র্যাগ করে/বেছে নিন — আপলোডের পর লিংক কপি করে Facebook বিজ্ঞাপনে দিন</p></div>
    </div>

    <form class="card card-pad" id="addForm" novalidate>
      <div class="field">
        <label for="pName">প্রোডাক্টের নাম <span class="req">*</span></label>
        <input class="input" id="pName" name="name" required placeholder="যেমন: Premium Pearl &amp; Kundan Gold Plated Bridal Necklace Set">
      </div>

      <div class="two">
        <div class="field" style="margin-bottom:0">
          <label for="pPrice">দাম (৳) <span class="req">*</span></label>
          <input class="input" id="pPrice" name="price" type="number" min="0" inputmode="numeric" required placeholder="750">
        </div>
        <div class="field" style="margin-bottom:0">
          <label for="pOldPrice">আগের দাম (৳) <span class="hint" style="display:inline">(ছাড় দেখাতে, ঐচ্ছিক)</span></label>
          <input class="input" id="pOldPrice" name="oldprice" type="number" min="0" inputmode="numeric" placeholder="950">
        </div>
      </div>

      <div class="field" style="margin-top:.8rem">
        <label for="pCategory">ক্যাটাগরি</label>
        <input class="input" id="pCategory" name="category" list="cats" placeholder="যেমন Bridal, Necklace, Waist-Chain">
        <datalist id="cats"><option value="Bridal"></option><option value="Necklace"></option><option value="Waist-Chain"></option><option value="komorerbicha"></option></datalist>
      </div>

      <fieldset class="dv">
        <legend>ট্যাগ (হোমপেজের সারির জন্য)</legend>
        <label class="chk"><input type="checkbox" name="tag" value="new"><span>🆕 নতুন পণ্য</span></label>
        <label class="chk"><input type="checkbox" name="tag" value="trending"><span>🔥 Trending</span></label>
        <label class="chk"><input type="checkbox" name="tag" value="offer"><span>🏷️ সেল / অফার</span></label>
      </fieldset>

      <div class="field" style="margin-top:.8rem">
        <label for="pStock">স্টক <span class="hint" style="display:inline">(খালি = সীমাহীন · 0 = স্টক শেষ)</span></label>
        <input class="input" id="pStock" name="stock" type="number" min="0" inputmode="numeric" placeholder="খালি রাখলে সীমাহীন">
      </div>

      <div class="field">
        <label for="pDesc">বিবরণ <span class="hint" style="display:inline">(প্রতি লাইনে একটা পয়েন্ট)</span></label>
        <textarea class="input" id="pDesc" name="desc" rows="5" placeholder="যেমন:&#10;Premium gold-plated finish&#10;Elegant pearl & kundan design&#10;Lightweight & comfortable"></textarea>
      </div>

      <div class="field">
        <label for="pVideo">YouTube ভিডিও <span class="hint" style="display:inline">(ঐচ্ছিক)</span></label>
        <input class="input" id="pVideo" name="video" type="url" placeholder="https://www.youtube.com/shorts/…">
      </div>

      <div class="field">
        <span style="font-size:.8rem;font-weight:700">ছবি <span class="req">*</span></span>
        <div class="pick" id="pickBtn" role="button" tabindex="0" aria-label="ছবি বেছে নিন">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>ছবি বেছে নিন (একসাথে একাধিক)</span>
          <small class="hint">JPG / PNG · প্রতি ছবি সর্বোচ্চ ~২ MB ভালো</small>
        </div>
        <input id="photoInput" type="file" accept="image/*" multiple hidden>
        <small id="fileCount" class="hint" style="margin-top:.25rem"></small>
        <div class="pv" id="previews"></div>
      </div>

      <div class="field">
        <label for="pLinks">অথবা ছবির লিংক <span class="hint" style="display:inline">(প্রতি লাইনে একটা, ঐচ্ছিক)</span></label>
        <textarea class="input" id="pLinks" name="links" rows="2" placeholder="https://drive.google.com/file/d/…"></textarea>
      </div>

      <button class="btn btn-primary btn-block" id="submitBtn" type="submit" style="min-height:52px;font-size:1rem">প্রোডাক্ট সেভ করুন</button>
      <p id="formMsg" class="field-error" role="status" style="margin-top:.5rem"></p>
    </form>

    <div class="card done" id="doneCard" hidden>
      <div style="font-size:2.2rem">✅</div>
      <h2 style="font-size:1.2rem;margin:.25rem 0">প্রোডাক্ট যোগ হয়েছে!</h2>
      <p class="hint" style="margin-bottom:.2rem">এই লিংকটা Facebook বিজ্ঞাপনে দিন:</p>
      <a class="link" id="productLink" href="#" target="_blank" rel="noopener"></a>
      <div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-gold" id="copyLinkBtn" type="button">লিংক কপি করুন</button>
        <button class="btn btn-primary" id="addAnotherBtn" type="button">আরেকটি প্রোডাক্ট যোগ করুন</button>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/admin.js"></script>
<script>
'use strict';
const { $, esc, ytId, api, requireAuth, renderSidebar, toast } = ADM;
let currentPw = null;
renderSidebar('add-product.html');
const msg = (t, bad) => { const el = $('#formMsg'); el.textContent = t || ''; el.classList.toggle('show', !!t); el.style.color = bad ? 'var(--danger)' : 'var(--success)'; };

let files = [];
const drawPreviews = () => {
  $('#fileCount').textContent = files.length ? `${files.length} টি ছবি বাছাই করা হয়েছে` : '';
  $('#previews').innerHTML = files.map((x, i) => `<div class="th"><img src="${x.u}" alt="ছবি ${i + 1}"><button type="button" data-i="${i}" aria-label="ছবি ${i + 1} সরান">✕</button></div>`).join('');
};
$('#pickBtn').addEventListener('click', () => $('#photoInput').click());
$('#pickBtn').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#photoInput').click(); } });
$('#photoInput').addEventListener('change', e => { [...(e.target.files || [])].forEach(f => files.push({ f, u: URL.createObjectURL(f) })); drawPreviews(); e.target.value = ''; });
$('#previews').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; files.splice(+b.dataset.i, 1); drawPreviews(); });

function shrink(file, max = 1400) {
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    im.onerror = () => rej(new Error('ছবি পড়া যায়নি: ' + file.name));
    im.src = u;
  });
}
async function toB64(file) {
  try { return await shrink(file); }
  catch (e) {
    if (file.size > 2500000) throw new Error('ছবিটি পড়া যায়নি — JPG/PNG ছবি দিন');
    return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(new Error('ছবি পড়া যায়নি')); fr.readAsDataURL(file); });
  }
}

$('#addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target.elements;
  const links = f.links.value.trim();
  if (f.video.value.trim() && !ytId(f.video.value.trim())) return msg('YouTube লিংকটি সঠিক নয় — আবার দেখুন।', true);
  if (!f.name.value.trim()) return msg('প্রোডাক্টের নাম দিন।', true);
  if (!f.price.value) return msg('দাম দিন।', true);
  if (files.length === 0 && !links) return msg('কমপক্ষে একটা ছবি বেছে নিন বা ছবির লিংক দিন।', true);

  const btn = $('#submitBtn');
  btn.disabled = true;
  try {
    const urls = [];
    for (let i = 0; i < files.length; i++) {
      msg(`ছবি ${i + 1}/${files.length} আপলোড হচ্ছে…`);
      const r = await api({ action: 'upload', password: currentPw, data: await toB64(files[i].f) });
      if (!r.ok) throw new Error(r.error || 'ছবি আপলোড হয়নি');
      urls.push(r.url);
    }
    const image = [...urls, ...links.split(/[\s,|]+/).filter(Boolean)].join('\n');
    const id = Date.now();
    msg('প্রোডাক্ট সেভ হচ্ছে…');
    const product = {
      id,
      name: f.name.value.trim(),
      price: f.price.value, oldprice: f.oldprice.value,
      category: f.category.value.trim(),
      tags: [...e.target.querySelectorAll('[name=tag]:checked')].map(x => x.value).join(','),
      stock: f.stock.value, desc: f.desc.value, video: f.video.value.trim(), image
    };
    const r = await api({ action: 'add', password: currentPw, product });
    if (!r.ok) throw new Error(r.error || 'সেভ হয়নি');
    const link = ADM.SITE_BASE + 'product.html?id=' + id;
    $('#productLink').href = link;
    $('#productLink').textContent = link;
    $('#addForm').hidden = true;
    $('#doneCard').hidden = false;
    window.scrollTo(0, 0);
    msg('');
    toast('প্রোডাক্ট যোগ হয়েছে ✓');
  } catch (err) {
    msg(err.message || 'সমস্যা হয়েছে, আবার চেষ্টা করুন।', true);
  } finally {
    btn.disabled = false;
  }
});
$('#copyLinkBtn').addEventListener('click', async () => {
  const link = $('#productLink').href;
  try { await navigator.clipboard.writeText(link); $('#copyLinkBtn').textContent = 'কপি হয়েছে ✓'; }
  catch { $('#copyLinkBtn').textContent = 'লিংক চেপে ধরে কপি করুন'; }
});
$('#addAnotherBtn').addEventListener('click', () => {
  const form = $('#addForm');
  form.reset(); files = []; drawPreviews(); msg('');
  $('#copyLinkBtn').textContent = 'লিংক কপি করুন';
  $('#doneCard').hidden = true; form.hidden = false; window.scrollTo(0, 0);
});

requireAuth(pw => { currentPw = pw; });
</script>
</body>
</html>
