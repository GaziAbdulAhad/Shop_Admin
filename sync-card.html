<section class="card card-pad" id="syncCard" style="margin-bottom:1rem">

    <div>
      <b style="color:var(--purple)">ডেটার অবস্থা</b>
      <p class="hint" id="syncState" style="margin-top:.15rem">…</p>

    <div style="display:flex;gap:.5rem">
      <button class="btn btn-outline btn-sm" id="syncBtn" type="button">🔄 শিট থেকে টান (Sync)</button>
      <button class="btn btn-gold btn-sm" id="pushBtn" type="button">⬆️ এই ডিভাইসের ডেটা শিটে পাঠান</button>
    </div>
  </div>
